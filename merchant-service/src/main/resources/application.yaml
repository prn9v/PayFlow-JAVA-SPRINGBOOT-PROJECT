spring:
  application:
    name: merchant-service

  datasource:
    url: jdbc:mysql://${USER_DB_HOST}:${USER_DB_PORT}/defaultdb?sslMode=REQUIRED
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    properties:
      security.protocol: SSL
      ssl.truststore.type: PEM
      ssl.keystore.type: PEM
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topics:
    merchant-activated: merchant-activated

server:
  port: ${MERCHANT_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

internal:
  api-key: ${INTERNAL_API_KEY}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator-endpoints: false

cache:
  merchant-credentials-ttl-minutes: 30
  merchant-ttl-minutes: 60

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health