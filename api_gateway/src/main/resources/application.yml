spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true       # ← true needed for cookies
            maxAge: 3600

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchants/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**, /api/refunds/**

        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/api/wallets/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # ── Swagger routes — forward api-docs requests to each service ──────
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs,/v3/api-docs

        - id: merchant-service-docs
          uri: lb://merchant-service
          predicates:
            - Path=/merchant-service/v3/api-docs
          filters:
            - RewritePath=/merchant-service/v3/api-docs,/v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs,/v3/api-docs

        - id: wallet-service-docs
          uri: lb://wallet-service
          predicates:
            - Path=/wallet-service/v3/api-docs
          filters:
            - RewritePath=/wallet-service/v3/api-docs,/v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs,/v3/api-docs

server:
  port: ${GATEWAY_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Merchant Service
        url: /merchant-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Wallet Service
        url: /wallet-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
  api-docs:
    enabled: true


management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health