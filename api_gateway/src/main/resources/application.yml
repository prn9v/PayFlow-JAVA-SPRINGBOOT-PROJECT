spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      x-forwarded:
        enabled: true

      routes:
        - id: auth-service
          uri: https://payflow-auth-service.onrender.com
          predicates:
            - Path=/api/auth/**

        - id: merchant-service
          uri: https://payflow-merchant-service-ryfx.onrender.com
          predicates:
            - Path=/api/merchants/**

        - id: payment-service
          uri: https://payflow-payment-service-xzbq.onrender.com
          predicates:
            - Path=/api/payments/**,/api/refunds/**

        - id: wallet-service
          uri: https://payflow-wallet-service-r17i.onrender.com
          predicates:
            - Path=/api/wallets/**

        - id: notification-service
          uri: https://payflow-notification-service.onrender.com
          predicates:
            - Path=/api/notifications/**

        # Swagger routes
        - id: auth-service-docs
          uri: https://payflow-auth-service.onrender.com
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs,/v3/api-docs

        - id: merchant-service-docs
          uri: https://payflow-merchant-service-ryfx.onrender.com
          predicates:
            - Path=/merchant-service/v3/api-docs
          filters:
            - RewritePath=/merchant-service/v3/api-docs,/v3/api-docs

        - id: payment-service-docs
          uri: https://payflow-payment-service-xzbq.onrender.com
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs,/v3/api-docs

        - id: wallet-service-docs
          uri: https://payflow-wallet-service-r17i.onrender.com
          predicates:
            - Path=/wallet-service/v3/api-docs
          filters:
            - RewritePath=/wallet-service/v3/api-docs,/v3/api-docs

        - id: notification-service-docs
          uri: https://payflow-notification-service.onrender.com
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs,/v3/api-docs

server:
  port: ${GATEWAY_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Merchant Service
        url: /merchant-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Wallet Service
        url: /wallet-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
  api-docs:
    enabled: true


management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health
