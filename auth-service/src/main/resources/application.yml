spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${USER_DB_HOST:payflow-pranavdeshmukh5454-95ff.h.aivencloud.com}:${USER_DB_PORT:21782}/${USER_DB_NAME:defaultdb}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:9f2083001@smtp-brevo.com}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: ${GOOGLE_CLIENT_REDIRECT_URL}

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user
            redirect-uri: ${GITHUB_CLIENT_REDIRECT_URL}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:https://payflow-eureka-server.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    non-secure-port: 443
    non-secure-port-enabled: false
    secure-port: 443
    secure-port-enabled: true
    instance-id: ${spring.application.name}:${RENDER_EXTERNAL_HOSTNAME:localhost}
    status-page-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health
    health-check-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health
    home-page-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

# From email shown to customers
notification:
  from-email: ${NOTIFICATION_FROM_EMAIL:pranavdeshmukh5454@gmail.com}
  from-name: ${NOTIFICATION_FROM_NAME:PayFlow}

springdoc:
  api-docs:
    enabled: true

oauth2:
  redirect-uri: http://localhost:3000/oauth2/callback

server:
  port: ${AUTH_PORT:8081}
  forward-headers-strategy: framework

swaggerURL: ${SWAGGER_URL:http://localhost:8080}

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health
