spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://${USER_DB_HOST:payflow-pranavdeshmukh5454-95ff.h.aivencloud.com}:${USER_DB_PORT:21782}/${USER_DB_NAME:defaultdb}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    addresses: ${RABBITMQ_URL}
    connection-timeout: 5000
    requested-heartbeat: 30
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

server:
  port: ${WALLET_PORT:8085}
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:https://payflow-eureka-server.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    non-secure-port: 443
    non-secure-port-enabled: false
    secure-port: 443
    secure-port-enabled: true
    instance-id: ${spring.application.name}:${RENDER_EXTERNAL_HOSTNAME:localhost}
    status-page-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health
    health-check-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health
    home-page-url: https://${RENDER_EXTERNAL_HOSTNAME:localhost}/
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

internal:
  api-key: ${INTERNAL_API_KEY:PranavDeshmukh}

wallet:
  default-currency: INR

swaggerURL: ${SWAGGER_URL:http://localhost:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator-endpoints: false

merchant-service:
  url: ${MERCHANT_SERVICE_URL:https://payflow-merchant-service-ryfx.onrender.com}

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health
