spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${USER_DB_HOST:payflow-pranavdeshmukh5454-95ff.h.aivencloud.com}:${USER_DB_PORT:21782}/${USER_DB_NAME:defaultdb}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    addresses: ${RABBITMQ_URL}
    connection-timeout: 5000
    requested-heartbeat: 30
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

#  elasticsearch:
#    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
#    connection-timeout: 5s
#    socket-timeout: 10s

server:
  port: ${PAYMENT_PORT:8083}
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Must match merchant-service internal.api-key exactly
internal:
  api-key: ${INTERNAL_API_KEY:PranavDeshmukh}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_SxwFzHNAMCcKCl}       # Your Test Key ID
  key-secret: ${RAZORPAY_KEY_SECRET:Y4623T4QNoro7pALogSFU8MX}      # Your Test Key Secret
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:payflow_webhook_secret_123}


resilience4j:

  circuitbreaker:
    instances:
      merchantService:
        # Open circuit after 50% failures in last 10 calls
        failure-rate-threshold: 50
        # Slow call threshold — calls taking > 3s count as failures
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        # Minimum calls before circuit can open
        minimum-number-of-calls: 5
        # How long to stay OPEN before trying again
        wait-duration-in-open-state: 30s
        # How many calls to allow in HALF-OPEN state
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Register health indicator in actuator
        register-health-indicator: true

      razorpayService:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        register-health-indicator: true

  retry:
    instances:
      merchantService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException

      razorpayService:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - com.razorpay.RazorpayException

  timelimiter:
    instances:
      merchantService:
        timeout-duration: 5s
      razorpayService:
        timeout-duration: 15s

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator-endpoints: false


swaggerURL: ${SWAGGER_URL:http://localhost:8080}

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health
